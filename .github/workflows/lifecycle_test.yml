name: CLI Lifecycle Test

on:
    workflow_dispatch:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    lifecycle-test:
        runs-on: ubuntu-latest
        steps:
            - name: Eat borger
              run: |
                  curl -fsSL https://eat.borger.dev | bash -s -- -y
                  echo "$HOME/.borger" >> "$GITHUB_PATH"

            - name: Install borger dev harness
              run: |
                  mkdir -p "$RUNNER_TEMP/harness"
                  cat > "$RUNNER_TEMP/harness/borger_dev_harness" <<'borger_dev_harness'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  #  borger_dev_harness [dev args...]
                  #
                  #brings borger dev up, waits for its status bar to say ready twice, points
                  #every browser at the client at once and takes it back down. two readys is
                  #the server and the client both up, and the bar is the only place that says
                  #so about both at once. cli.sh only draws it on a terminal, so dev runs
                  #under a pty and the bar is read back out of the typescript that pty writes

                  READY_WORD="ready"
                  READY_NEEDED=2
                  BAR_LINE='^[[:space:]]*server:[[:space:]]'
                  TAIL_BYTES=20000

                  #the bar trims itself to the terminal width and a fresh pty is zero by
                  #zero: too narrow and it is drawn empty, never saying ready however ready
                  #everything is
                  PTY_ROWS=50
                  PTY_COLS=200

                  #playwright lives beside this script rather than in the game under test
                  export NODE_PATH="$(dirname "$(readlink -f "$0")")/node_modules"

                  #declared up here because the trap can reach the teardown before any of
                  #them are filled in
                  STATE=""
                  LOG=""
                  DEV_PID=""

                  die()
                  {
                      printf 'borger_dev_harness: %s\n' "$*" >&2
                      exit 1
                  }

                  is_running()
                  {
                      [ -n "$DEV_PID" ] && kill -0 "$DEV_PID" 2>/dev/null
                  }

                  #the bar is drawn in colour and ends its lines with ESC D rather than a
                  #newline, hence the carriage returns and the second expression. line
                  #buffered because one end of this is a live stream: left alone both of
                  #these sit on a block's worth of output
                  strip_escapes()
                  {
                      stdbuf -oL tr '\r' '\n' \
                          | sed -u \
                              -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' \
                              -e 's/\x1b.//g' \
                              -e '/^[[:space:]]*$/d' \
                          || true
                  }

                  bar()
                  {
                      local out
                      out=$(tail -c "$TAIL_BYTES" "$LOG" 2>/dev/null | strip_escapes | tail -n 1) || out=""
                      printf '%s' "$out"
                  }

                  #counted here rather than through grep so an empty bar is a count of zero
                  #instead of a failed pipeline, which pipefail would take the script down for
                  count_ready()
                  {
                      local rest="$1" n=0

                      while [[ "$rest" == *"$READY_WORD"* ]]; do
                          rest="${rest#*"$READY_WORD"}"
                          n=$(( n + 1 ))
                      done

                      printf '%s' "$n"
                  }

                  #the bar is dropped rather than printed: it is redrawn between every pair
                  #of log lines and would bury the output it sits under
                  log_stream()
                  {
                      strip_escapes | grep --line-buffered -v "$BAR_LINE" || true
                  }

                  #ctrl+c down the pty, which is the shutdown borger dev and concurrently
                  #are actually written against: the line discipline turns the byte into a
                  #SIGINT aimed at everything in the foreground of that terminal, which a
                  #kill at this end could not address
                  stop()
                  {
                      if is_running; then
                          printf '\003' >&3 2>/dev/null || true
                      fi

                      if [ -n "$DEV_PID" ]; then
                          wait "$DEV_PID" 2>/dev/null || true
                          DEV_PID=""
                      fi
                  }

                  cleanup()
                  {
                      stop

                      #the log stream ends on its own once nothing is writing to the pipe.
                      #waited for rather than killed, so its last lines land before this
                      #script's exit does
                      wait 2>/dev/null || true

                      if [ -n "$STATE" ]; then
                          rm -rf "$STATE"
                      fi
                  }

                  #script takes its command as one string for a shell of its own to read,
                  #so forwarded arguments are quoted back into it rather than passed as words
                  CMD="borger dev"

                  for arg in "$@"; do
                      CMD="$CMD $(printf '%q' "$arg")"
                  done

                  #nothing is left behind on any way out of here: a dev server that outlives
                  #its step holds port 5173 and answers the next step's pgrep, which reads
                  #as a bar that went green before anything was built
                  trap cleanup EXIT
                  trap 'exit 130' INT TERM HUP

                  STATE=$(mktemp -d)
                  LOG="$STATE/dev.log"
                  KEYS="$STATE/keys"
                  OUT="$STATE/out"

                  mkfifo "$KEYS" "$OUT"

                  #the pty's keyboard, held open for reading as well as writing so the open
                  #cannot block and the far end never sees the keyboard hang up, which is
                  #what the last writer closing looks like from there
                  exec 3<> "$KEYS"

                  : > "$LOG"

                  #backgrounded because opening either half of a fifo waits for the other,
                  #and these two meet in the middle
                  log_stream < "$OUT" &

                  #the stty runs inside the pty, the only place its size can be set from
                  script -q -f -c "stty rows $PTY_ROWS cols $PTY_COLS; $CMD" "$LOG" \
                      < "$KEYS" > "$OUT" 2>&1 &
                  DEV_PID=$!

                  #no clock of its own: the step that called this already carries a timeout
                  while true; do
                      if ! is_running; then
                          die "$CMD exited before it came up"
                      fi

                      if (( $(count_ready "$(bar)") >= READY_NEEDED )); then
                          break
                      fi

                      sleep 2
                  done

                  STATUS=0

                  node - <<'browser_test' || STATUS=$?
                  'use strict';

                  //loads the dev client in every browser at once and waits for "Load time:",
                  //the client's own console line at the end of startup. everything else in
                  //this test proves the server; this is the only thing that says the page
                  //boots, and running them together makes it several players at once as well

                  const playwright = require('playwright');

                  const URL = 'https://localhost:5173';
                  const DONE = 'Load time:';

                  //a device descriptor keeps the user agent, viewport, pixel ratio and touch
                  //flag agreeing with each other, which matters because the client asks about
                  //them separately: chromium on android is the combination that has to fall
                  //back from webtransport to websockets. the descriptor also names the
                  //browser it belongs to, so only the plain entries go by their own key
                  const BROWSERS = {
                      chromium: {},
                      android: playwright.devices['Pixel 5'],
                      firefox: {},
                      webkit: {},
                  };

                  async function run(label, device)
                  {
                      const browser = await playwright[device.defaultBrowserType || label].launch();

                      try {
                          const context = await browser.newContext({
                              ...device,

                              //the dev server signs its own certificate, and a headless
                              //browser has no interstitial there is any way to click through
                              ignoreHTTPSErrors: true,
                          });
                          const page = await context.newPage();

                          //armed before the navigation, or a client that starts up faster
                          //than this gets a listener attached would never be seen to finish
                          await new Promise((resolve, reject) => {
                              const fail = why => reject(new Error(`[${label}] ${why}`));

                              page.on('console', msg => {
                                  const text = msg.text();
                                  console.log(`[${label}] ${text}`);

                                  if (text.includes(DONE)) {
                                      resolve();
                                  }
                              });

                              //these two never reach the console handler above: playwright
                              //hands them out as events of their own, and a client that
                              //throws or cannot fetch something has not loaded
                              page.on('pageerror', err => fail(`uncaught: ${err.message}`));
                              page.on('requestfailed', req =>
                                  fail(`request failed: ${req.url()} ${req.failure().errorText}`));

                              //commit rather than load: a wasm client keeps loading long
                              //after it is up, and waiting on load would outlast the console
                              //line this is here for. no clock either, the step has one
                              page.goto(URL, { waitUntil: 'commit', timeout: 0 }).catch(err => fail(err.message));
                          });
                      } finally {
                          await browser.close();
                      }
                  }

                  //the first browser to fail takes the whole run down with it rather than
                  //waiting on the others, which are about to lose their server anyway
                  Promise.all(Object.entries(BROWSERS).map(entry => run(...entry))).catch(err => {
                      console.error(err);
                      process.exit(1);
                  });
                  browser_test

                  exit "$STATUS"
                  borger_dev_harness
                  chmod +x "$RUNNER_TEMP/harness/borger_dev_harness"

                  cd "$RUNNER_TEMP/harness"
                  npm init -y > /dev/null

                  #the postinstall download is skipped and the browsers are then asked for
                  #by name, which is the only way to get the system libraries they need
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund playwright
                  npx playwright install --with-deps chromium firefox webkit
                  echo "$RUNNER_TEMP/harness" >> "$GITHUB_PATH"

            - name: "New game: borger init"
              run: |
                  borger init lifecycle_test_new

            - name: "New game: borger dev"
              timeout-minutes: 5
              working-directory: lifecycle_test_new
              run: |
                  borger_dev_harness

            - name: "New game: borger clean"
              working-directory: lifecycle_test_new
              run: |
                  borger clean <<< "y"

            - name: "New game: delete"
              run: |
                  rm -rf lifecycle_test_new

            - name: "Existing game: clone"
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1
                  path: lifecycle_test_existing

            - name: "Existing game: borger install"
              working-directory: lifecycle_test_existing
              run: |
                  borger install

            - name: "Existing game: borger release"
              working-directory: lifecycle_test_existing
              run: |
                  borger release <<< "y"

            - name: "Existing game: borger dev"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness

            - name: "Existing game: borger dev --session-replay"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness --session-replay

            - name: "Existing game: borger dev --singlethreaded"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness --singlethreaded

            - name: "Existing game: borger dev --session-replay --singlethreaded"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness --session-replay --singlethreaded
