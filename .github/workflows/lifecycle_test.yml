name: CLI Lifecycle Test

on:
    workflow_dispatch:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    lifecycle-test:
        runs-on: ubuntu-latest
        steps:
            - name: Eat borger
              run: |
                  curl -fsSL https://eat.borger.dev | bash -s -- -y
                  echo "$HOME/.borger" >> "$GITHUB_PATH"

            - name: Install borger dev harness
              run: |
                  mkdir -p "$RUNNER_TEMP/bin"
                  cat > "$RUNNER_TEMP/bin/borger_dev_harness" <<'borger_dev_harness'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  #a borger dev server that outlives the shell which started it, so one CI
                  #step can bring it up and a later one can take it down. everything the
                  #two commands need to find each other again lives in a state directory
                  #rather than in this process.
                  #
                  #cli.sh only draws its status bar on a terminal and a runner hasn't got
                  #one, so dev is run under a pty and the bar is read back out of the
                  #typescript that pty writes. two readys on the last line is the server
                  #and the client both up, which is the whole definition of started here:
                  #the bar is the only place that says so about both halves at once.
                  #
                  #  borger_dev_harness up [args...]  start it here, return once the bar
                  #                                   says ready twice. anything after up
                  #                                   is passed on to borger dev
                  #  borger_dev_harness down          ctrl+c it and print whatever it said
                  #                                   after it came up, or fail if it isn't up

                  STATE="${borger_dev_harness_STATE:-${RUNNER_TEMP:-/tmp}/borger_dev_harness}"
                  LOG="$STATE/dev.log"
                  KEYS="$STATE/keys"
                  PIDFILE="$STATE/pid"
                  HOLDFILE="$STATE/holder"
                  SEENFILE="$STATE/forwarded"

                  DEV_CMD="${borger_dev_harness_CMD:-borger dev}"

                  READY_WORD="ready"
                  READY_NEEDED=2

                  #the status bar, once its colours are off: the server field is the first
                  #thing on it, and nothing else in the log begins that way
                  BAR_LINE='^[[:space:]]*server:[[:space:]]'

                  #the bar is redrawn after every log line, so the end of the file is the
                  #only part worth reading, and it is nowhere near this big
                  TAIL_BYTES=20000

                  #whoever holds the keyboard end of the pty open has to outlive the whole
                  #job, since the far end hangs up when the last writer closes
                  HOLD_FOR=86400

                  #a freshly allocated pty is zero by zero until somebody says otherwise,
                  #and script has no terminal of its own to copy a size from out here. the
                  #bar asks the terminal how wide it is and trims itself to fit, so a width
                  #of zero trims it away to nothing: a bar that is drawn, is empty, and
                  #never says ready however ready everything is. wide enough for the whole
                  #bar and then some, so nothing is lost off the end either
                  PTY_ROWS=50
                  PTY_COLS=200

                  die()
                  {
                      printf 'borger_dev_harness: %s\n' "$*" >&2
                      exit 1
                  }

                  read_pid()
                  {
                      local file="$1" pid=""

                      if [ -r "$file" ]; then
                          pid=$(cat "$file") || pid=""
                      fi

                      printf '%s' "$pid"
                  }

                  is_running()
                  {
                      local pid
                      pid=$(read_pid "$PIDFILE")

                      if [ -z "$pid" ]; then
                          return 1
                      fi

                      kill -0 "$pid" 2>/dev/null
                  }

                  #the bar is drawn in colour and ends its lines with ESC D rather than a
                  #newline, so the escapes come off before any of this reads as lines
                  strip_escapes()
                  {
                      sed -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' -e 's/\x1b.//g' \
                          | tr '\r' '\n' \
                          | grep -v '^[[:space:]]*$' \
                          || true
                  }

                  bar()
                  {
                      local out
                      out=$(tail -c "$TAIL_BYTES" "$LOG" 2>/dev/null | strip_escapes | tail -n 1) || out=""
                      printf '%s' "$out"
                  }

                  #counted here rather than through grep so an empty bar is a count of zero
                  #instead of a failed pipeline, which under pipefail would take the whole
                  #script down with it on the first poll
                  count_ready()
                  {
                      local rest="$1" n=0

                      while [[ "$rest" == *"$READY_WORD"* ]]; do
                          rest="${rest#*"$READY_WORD"}"
                          n=$(( n + 1 ))
                      done

                      printf '%s' "$n"
                  }

                  #how much of the log has already been printed to the step output. the
                  #whole file is not reprinted every poll, only the part that is new
                  #
                  #kept in the state directory rather than in a variable because up and
                  #down are two runs of this script and the part down is here to print is
                  #exactly the part up never saw: everything the dev server said between
                  #the bar going green and the ctrl+c, which had not been written yet when
                  #the step that started it returned
                  seen()
                  {
                      local n=""

                      if [ -r "$SEENFILE" ]; then
                          n=$(cat "$SEENFILE") || n=""
                      fi

                      printf '%s' "$(( n + 0 ))"
                  }

                  #everything borger dev has said since the last look, minus the status bar
                  #itself, which is redrawn between every pair of log lines and would bury
                  #the output it is sitting under. the bar is the one line that starts with
                  #the server field, since concurrently prefixes its own with a name tag.
                  #
                  #a line still being written is printed as far as it got and the rest
                  #follows on the next pass, which is not worth the offset bookkeeping to
                  #avoid: this is here to be read while something is going wrong
                  forward()
                  {
                      local size from

                      #tested before the redirect rather than after: a redirect from a
                      #file that isn't there is the shell's complaint, not the command's,
                      #and it is made before any 2>/dev/null on the line can catch it
                      if [ ! -r "$LOG" ]; then
                          return 0
                      fi

                      from=$(seen)

                      size=$(wc -c < "$LOG")
                      size=$(( size ))

                      if (( size <= from )); then
                          return 0
                      fi

                      tail -c "+$(( from + 1 ))" "$LOG" 2>/dev/null \
                          | head -c "$(( size - from ))" \
                          | strip_escapes \
                          | grep -v "$BAR_LINE" \
                          || true

                      printf '%s' "$size" > "$SEENFILE"
                  }

                  #ctrl+c down the pty, which is the shutdown borger dev and concurrently
                  #are actually written against: the line discipline turns the byte into a
                  #SIGINT aimed at everything in the foreground of that terminal, which a
                  #kill at this end could not address
                  stop()
                  {
                      local pid holder

                      pid=$(read_pid "$PIDFILE")
                      holder=$(read_pid "$HOLDFILE")

                      if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                          printf '\003' > "$KEYS" 2>/dev/null || true

                          while kill -0 "$pid" 2>/dev/null; do
                              sleep 0.2
                          done
                      fi

                      if [ -n "$holder" ]; then
                          kill "$holder" 2>/dev/null || true
                      fi

                      rm -f "$KEYS" "$PIDFILE" "$HOLDFILE"
                  }

                  harness_up()
                  {
                      local line="" n=0 arg="" cmd="$DEV_CMD"

                      #script takes its command as one string for a shell to read, so the
                      #arguments forwarded from the caller are quoted back into that string
                      #rather than handed over as words
                      for arg in "$@"; do
                          cmd="$cmd $(printf '%q' "$arg")"
                      done

                      if is_running; then
                          die "already up (pid $(read_pid "$PIDFILE"))"
                      fi

                      rm -rf "$STATE"
                      mkdir -p "$STATE"
                      mkfifo "$KEYS"

                      #the fifo is the pty's keyboard and this is the finger resting on it.
                      #both ends open in the background because opening either half of a
                      #fifo blocks until the other one shows up
                      sleep "$HOLD_FOR" > "$KEYS" &
                      echo $! > "$HOLDFILE"

                      #the log is made before anything can look for it, so the first poll
                      #reads an empty file rather than a missing one
                      : > "$LOG"

                      #started right where it was called from, so the directory is the
                      #caller's business and stays that way. the stty runs inside the pty,
                      #which is the only place from which its size can be set.
                      #
                      #every handle it was given belongs to this state directory and none
                      #to the caller's terminal. a background child still holding the
                      #step's stdout is a step that never finishes, and the point of this
                      #is to still be here when the next one starts
                      script -q -f -c "stty rows $PTY_ROWS cols $PTY_COLS; $cmd" "$LOG" \
                          < "$KEYS" > /dev/null 2>&1 &
                      echo $! > "$PIDFILE"

                      #no clock of its own: waiting forever is the caller's decision to
                      #make, and the step that called this already carries a timeout. the
                      #only way out other than ready is the dev server dying
                      while true; do
                          forward

                          if ! is_running; then
                              stop
                              forward
                              die "$cmd exited before it came up"
                          fi

                          line=$(bar)
                          n=$(count_ready "$line")

                          if (( n >= READY_NEEDED )); then
                              return 0
                          fi

                          sleep 2
                      done
                  }

                  harness_down()
                  {
                      if ! is_running; then
                          die "not up, nothing to take down"
                      fi

                      stop

                      #after the wait in stop rather than before it, so what is printed is
                      #the whole rest of the log: a dev server on its way out has things to
                      #say about going, and the last of them are written between the ctrl+c
                      #and the process leaving the table
                      forward
                  }

                  case "${1:-}" in
                      up)
                          shift
                          harness_up "$@"
                          ;;
                      down)
                          harness_down
                          ;;
                      *)
                          die "usage: borger_dev_harness up [args...] | borger_dev_harness down"
                          ;;
                  esac
                  borger_dev_harness
                  chmod +x "$RUNNER_TEMP/bin/borger_dev_harness"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Install borger browser harness
              run: |
                  mkdir -p "$RUNNER_TEMP/client_test"
                  cat > "$RUNNER_TEMP/client_test/borger_browser_harness" <<'client_test'
                  #!/usr/bin/env node
                  'use strict';

                  //loads the dev client in a real browser and waits for it to say it
                  //finished starting up. everything else in this test proves the server:
                  //that it built, that it is in the process table, that the bar went
                  //green. none of that says the thing vite serves actually boots, and the
                  //only place that answer exists is inside the page.
                  //
                  //"Load time:" is the client's own console line at the end of startup,
                  //so that line arriving is the whole test
                  //
                  //  borger_browser_harness          load it as a desktop browser
                  //  borger_browser_harness android  load it as an android phone

                  const { chromium, devices } = require('playwright');

                  const URL = process.env.CLIENT_URL || 'https://localhost:5173';
                  const DONE = process.env.CLIENT_DONE || 'Load time:';

                  //a phone is not one setting but a set of them that have to agree: the
                  //user agent, the viewport, the pixel ratio and whether there is a touch
                  //screen are all asked about separately by whatever is deciding this is
                  //mobile, and a client that reads two of them and is told different
                  //stories is a client under a machine that exists nowhere. playwright
                  //keeps them together per device, so the device is what is named here
                  //rather than the settings
                  //
                  //pixel 5 is a chromium descriptor, so it rides the browser already
                  //installed for the desktop run
                  const PROFILES = {
                      desktop: {},
                      android: devices['Pixel 5'],
                  };

                  const PROFILE = process.argv[2] || 'desktop';

                  async function main()
                  {
                      if (!(PROFILE in PROFILES)) {
                          throw new Error(`unknown profile '${PROFILE}', expected one of: ${Object.keys(PROFILES).join(', ')}`);
                      }

                      console.log(`profile: ${PROFILE}`);

                      //the dev server signs its own certificate. told to the context, the
                      //browser accepts it outright, which is steadier than driving the
                      //interstitial: headless chromium may not show one to click
                      const browser = await chromium.launch();
                      const context = await browser.newContext({
                          ...PROFILES[PROFILE],
                          ignoreHTTPSErrors: true,
                      });
                      const page = await context.newPage();

                      //armed before the navigation, or a client that starts up faster
                      //than this gets a listener attached would never be seen to finish
                      const loaded = new Promise(resolve => {
                          page.on('console', msg => {
                              const text = msg.text();
                              console.log(text);

                              if (text.includes(DONE)) {
                                  resolve();
                              }
                          });
                      });

                      //a client that dies on the way up says so here rather than going
                      //quiet until the step runs out of time
                      page.on('pageerror', err => console.log(`uncaught: ${err.message}`));
                      page.on('requestfailed', req =>
                          console.log(`Request failed: ${req.url()} ${req.failure().errorText}`));

                      //commit rather than load: a wasm client is entitled to keep loading
                      //long after it is up, and waiting on load would outlast the console
                      //line this is actually here for. no clock either, the step has one
                      await page.goto(URL, { waitUntil: 'commit', timeout: 0 });
                      await loaded;

                      await browser.close();
                  }

                  main().catch(err => {
                      console.error(err);
                      process.exit(1);
                  });
                  client_test

                  cd "$RUNNER_TEMP/client_test"
                  chmod +x borger_browser_harness
                  npm init -y > /dev/null

                  #the browsers are skipped on the way in and then asked for by name, or
                  #npm fetches firefox and webkit as well to leave them sitting unused
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund playwright
                  npx playwright install --with-deps chromium
                  echo "$RUNNER_TEMP/client_test" >> "$GITHUB_PATH"

            - name: "New game: borger init"
              run: |
                  borger init lifecycle_test_new

            - name: "New game: borger dev"
              timeout-minutes: 5
              working-directory: lifecycle_test_new
              run: |
                  borger_dev_harness up
                  borger_dev_harness down

            - name: "New game: borger clean"
              working-directory: lifecycle_test_new
              run: |
                  borger clean <<< "y"

            - name: "New game: delete"
              run: |
                  rm -rf lifecycle_test_new

            - name: "Existing game: clone"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1
                  path: lifecycle_test_existing

            - name: "Existing game: borger install"
              working-directory: lifecycle_test_existing
              run: |
                  borger install

            - name: "Browser harness: dev"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness up
                  borger_browser_harness
                  borger_dev_harness down

            - name: "Browser harness: dev (Android/WebSocket fallback)"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness up
                  borger_browser_harness android
                  borger_dev_harness down

            - name: "Browser harness: dev --session-replay"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness up --session_replay
                  borger_browser_harness
                  borger_dev_harness down
