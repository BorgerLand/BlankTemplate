name: CLI Lifecycle Test

on:
    workflow_dispatch:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    lifecycle-test:
        runs-on: ubuntu-latest
        steps:
            - name: Eat borger
              run: |
                  curl -fsSL https://eat.borger.dev | bash -s -- -y
                  echo "$HOME/.borger" >> "$GITHUB_PATH"

            - name: Install borger dev harness
              run: |
                  mkdir -p "$RUNNER_TEMP/bin"
                  cat > "$RUNNER_TEMP/bin/borger_dev_harness" <<'borger_dev_harness'
                  #!/usr/bin/env bash
                  set -euo pipefail

                  #  borger_dev_harness [dev args...] [-- command [args...]]
                  #
                  #brings borger dev up, waits for its status bar to say ready twice, runs
                  #the command against it and takes it back down. two readys is the server
                  #and the client both up, and the bar is the only place that says so about
                  #both at once. cli.sh only draws it on a terminal, so dev runs under a pty
                  #and the bar is read back out of the typescript that pty writes

                  DEV_CMD="${borger_dev_harness_CMD:-borger dev}"

                  READY_WORD="ready"
                  READY_NEEDED=2
                  BAR_LINE='^[[:space:]]*server:[[:space:]]'
                  TAIL_BYTES=20000

                  #the bar trims itself to the terminal width and a fresh pty is zero by
                  #zero: too narrow and it is drawn empty, never saying ready however ready
                  #everything is
                  PTY_ROWS=50
                  PTY_COLS=200

                  #declared up here because the trap can reach the teardown before any of
                  #them are filled in
                  STATE=""
                  LOG=""
                  DEV_PID=""

                  die()
                  {
                      printf 'borger_dev_harness: %s\n' "$*" >&2
                      exit 1
                  }

                  is_running()
                  {
                      [ -n "$DEV_PID" ] && kill -0 "$DEV_PID" 2>/dev/null
                  }

                  #the bar is drawn in colour and ends its lines with ESC D rather than a
                  #newline, hence the carriage returns and the second expression. line
                  #buffered because one end of this is a live stream: left alone both of
                  #these sit on a block's worth of output
                  strip_escapes()
                  {
                      stdbuf -oL tr '\r' '\n' \
                          | sed -u \
                              -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' \
                              -e 's/\x1b.//g' \
                              -e '/^[[:space:]]*$/d' \
                          || true
                  }

                  bar()
                  {
                      local out
                      out=$(tail -c "$TAIL_BYTES" "$LOG" 2>/dev/null | strip_escapes | tail -n 1) || out=""
                      printf '%s' "$out"
                  }

                  #counted here rather than through grep so an empty bar is a count of zero
                  #instead of a failed pipeline, which pipefail would take the script down for
                  count_ready()
                  {
                      local rest="$1" n=0

                      while [[ "$rest" == *"$READY_WORD"* ]]; do
                          rest="${rest#*"$READY_WORD"}"
                          n=$(( n + 1 ))
                      done

                      printf '%s' "$n"
                  }

                  #the bar is dropped rather than printed: it is redrawn between every pair
                  #of log lines and would bury the output it sits under
                  log_stream()
                  {
                      strip_escapes | grep --line-buffered -v "$BAR_LINE" || true
                  }

                  #ctrl+c down the pty, which is the shutdown borger dev and concurrently
                  #are actually written against: the line discipline turns the byte into a
                  #SIGINT aimed at everything in the foreground of that terminal, which a
                  #kill at this end could not address
                  stop()
                  {
                      if is_running; then
                          printf '\003' >&3 2>/dev/null || true
                      fi

                      if [ -n "$DEV_PID" ]; then
                          wait "$DEV_PID" 2>/dev/null || true
                          DEV_PID=""
                      fi
                  }

                  cleanup()
                  {
                      stop

                      #the log stream ends on its own once nothing is writing to the pipe.
                      #waited for rather than killed, so its last lines land before this
                      #script's exit does
                      wait 2>/dev/null || true

                      if [ -n "$STATE" ]; then
                          rm -rf "$STATE"
                      fi
                  }

                  #script takes its command as one string for a shell of its own to read,
                  #so forwarded arguments are quoted back into it rather than passed as words
                  CMD="$DEV_CMD"

                  while (( $# )); do
                      if [ "$1" = "--" ]; then
                          shift
                          break
                      fi

                      CMD="$CMD $(printf '%q' "$1")"
                      shift
                  done

                  #nothing is left behind on any way out of here: a dev server that outlives
                  #its step holds port 5173 and answers the next step's pgrep, which reads
                  #as a bar that went green before anything was built
                  trap cleanup EXIT
                  trap 'exit 130' INT TERM HUP

                  STATE=$(mktemp -d)
                  LOG="$STATE/dev.log"
                  KEYS="$STATE/keys"
                  OUT="$STATE/out"

                  mkfifo "$KEYS" "$OUT"

                  #the pty's keyboard, held open for reading as well as writing so the open
                  #cannot block and the far end never sees the keyboard hang up, which is
                  #what the last writer closing looks like from there
                  exec 3<> "$KEYS"

                  : > "$LOG"

                  #backgrounded because opening either half of a fifo waits for the other,
                  #and these two meet in the middle
                  log_stream < "$OUT" &

                  #the stty runs inside the pty, the only place its size can be set from
                  script -q -f -c "stty rows $PTY_ROWS cols $PTY_COLS; $CMD" "$LOG" \
                      < "$KEYS" > "$OUT" 2>&1 &
                  DEV_PID=$!

                  #no clock of its own: the step that called this already carries a timeout
                  while true; do
                      if ! is_running; then
                          die "$CMD exited before it came up"
                      fi

                      if (( $(count_ready "$(bar)") >= READY_NEEDED )); then
                          break
                      fi

                      sleep 2
                  done

                  STATUS=0

                  if (( $# )); then
                      "$@" || STATUS=$?
                  fi

                  exit "$STATUS"
                  borger_dev_harness
                  chmod +x "$RUNNER_TEMP/bin/borger_dev_harness"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Install borger browser harness
              run: |
                  mkdir -p "$RUNNER_TEMP/client_test"
                  cat > "$RUNNER_TEMP/client_test/borger_browser_harness" <<'client_test'
                  #!/usr/bin/env node
                  'use strict';

                  //  borger_browser_harness          load it as a desktop browser
                  //  borger_browser_harness android  load it as an android phone
                  //
                  //loads the dev client in a real browser and waits for "Load time:", the
                  //client's own console line at the end of startup. everything else in this
                  //test proves the server; this is the only thing that says the page boots

                  const { chromium, devices } = require('playwright');

                  const URL = process.env.CLIENT_URL || 'https://localhost:5173';
                  const DONE = process.env.CLIENT_DONE || 'Load time:';

                  //a device descriptor keeps the user agent, viewport, pixel ratio and
                  //touch flag agreeing with each other, which matters because whatever is
                  //deciding this is mobile asks about them separately. pixel 5 is a
                  //chromium descriptor, so it rides the browser already installed
                  const PROFILES = {
                      desktop: {},
                      android: devices['Pixel 5'],
                  };

                  const PROFILE = process.argv[2] || 'desktop';

                  async function main()
                  {
                      if (!(PROFILE in PROFILES)) {
                          throw new Error(`unknown profile '${PROFILE}', expected one of: ${Object.keys(PROFILES).join(', ')}`);
                      }

                      console.log(`profile: ${PROFILE}`);

                      const browser = await chromium.launch();
                      const context = await browser.newContext({
                          ...PROFILES[PROFILE],

                          //the dev server signs its own certificate, and headless chromium
                          //may not show an interstitial there is any way to click through
                          ignoreHTTPSErrors: true,
                      });
                      const page = await context.newPage();

                      //armed before the navigation, or a client that starts up faster
                      //than this gets a listener attached would never be seen to finish
                      const loaded = new Promise(resolve => {
                          page.on('console', msg => {
                              const text = msg.text();
                              console.log(text);

                              if (text.includes(DONE)) {
                                  resolve();
                              }
                          });
                      });

                      page.on('pageerror', err => console.log(`uncaught: ${err.message}`));
                      page.on('requestfailed', req =>
                          console.log(`Request failed: ${req.url()} ${req.failure().errorText}`));

                      //commit rather than load: a wasm client keeps loading long after it
                      //is up, and waiting on load would outlast the console line this is
                      //here for. no clock either, the step has one
                      await page.goto(URL, { waitUntil: 'commit', timeout: 0 });
                      await loaded;

                      await browser.close();
                  }

                  main().catch(err => {
                      console.error(err);
                      process.exit(1);
                  });
                  client_test

                  cd "$RUNNER_TEMP/client_test"
                  chmod +x borger_browser_harness
                  npm init -y > /dev/null

                  #skipped on the way in and then asked for by name, or npm fetches firefox
                  #and webkit as well to leave them sitting unused
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund playwright
                  npx playwright install --with-deps chromium
                  echo "$RUNNER_TEMP/client_test" >> "$GITHUB_PATH"

            - name: "New game: borger init"
              run: |
                  borger init lifecycle_test_new

            - name: "New game: borger dev"
              timeout-minutes: 5
              working-directory: lifecycle_test_new
              run: |
                  borger_dev_harness

            - name: "New game: borger clean"
              working-directory: lifecycle_test_new
              run: |
                  borger clean <<< "y"

            - name: "New game: delete"
              run: |
                  rm -rf lifecycle_test_new

            - name: "Existing game: clone"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1
                  path: lifecycle_test_existing

            - name: "Existing game: borger install"
              working-directory: lifecycle_test_existing
              run: |
                  borger install

            - name: "Existing game: borger release"
              working-directory: lifecycle_test_existing
              run: |
                  borger release <<< "y"

            - name: "Browser harness: dev"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness -- borger_browser_harness

            - name: "Browser harness: dev (Android/WebSocket fallback)"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness -- borger_browser_harness android

            - name: "Browser harness: dev --session-replay"
              timeout-minutes: 5
              working-directory: lifecycle_test_existing
              run: |
                  borger_dev_harness --session-replay -- borger_browser_harness
